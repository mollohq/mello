# The user flows that mello must keep working. See plans/E2E-QA.md §9.
#
# One entry for each flow. Three keys list what exercises the flow today:
#   harness  — test functions in client/src (headless, fake core events)
#   journeys — scripts that drive the real app against the local stack
#   protocol — case IDs in qa/protocol/*.md (agent and human runs)
# `issues` lists open GitHub issues that block or break the flow.
#
# client/src/flow_catalogue.rs checks this file in `cargo test`: unique IDs,
# a valid priority, and every harness test and journey that it names exists.
# Keep to the flat format below: one key per line, lists in [ ].
#
# Priority: P0 = a user cannot use mello without it. P1 = core but has a
# workaround. P2 = secondary. P3 = polish.

