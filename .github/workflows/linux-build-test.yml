name: Linux build and test

# The Linux lane of PR Checks (pr-checks.yml calls this file).
# linux-cache-warm.yml calls it on a push to main to save the caches in the
# scope of main. Three jobs run in parallel on separate runners: Clippy, the
# Rust tests and the libmello C++ tests. Run as one serial job, the lane took
# 25m38s. The shared setup is the local action .github/actions/linux-setup.
on:
  workflow_call:
    inputs:
      # 'false' skips the libmello gtest build and ctest: no native input
      # changed (see the `changes` job in pr-checks.yml).
      native:
        type: string
        default: 'true'

permissions:
  contents: read

env:
  # See pr-checks.yml: hardware-dependent voice/video tests block without it.
  CI: "true"
  # Same reasons as the Windows job: no incremental data is reused on a
  # fresh runner, and full debug info only slows the link.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # The toolchain of the developer Mac and the build container.
  RUST_VERSION: "1.94.0"
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  # sccache caches the Rust and the C++ compiles in the GitHub Actions cache
  # (the setup action installs it). sccache needs CARGO_INCREMENTAL=0, set
  # above. CMake reads the *_COMPILER_LAUNCHER env vars, so the cmake build
  # of the mello-sys build script and the C++ job both go through sccache.
  # linux-cache-warm.yml fills the cache from main, where every PR reads it.
  # The repository cache limit is 10 GB, shared with the vcpkg and cargo
  # registry caches; GitHub evicts the least recently used entries.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

# Ubuntu 24.04 in every job: glibc 2.39, the floor of the Linux release (the
# AppImage builds in the same base, scripts/linux/Dockerfile). The hosted
# image has about 86 GB free and the build needs about 20 GB, so no job frees
# disk space. Each timeout covers a cold run (the vcpkg ports, Skia's
# bindings and the workspace on 4 vCPU); it is for a wedged runner, not a
# slow one.
jobs:
  clippy:
    name: Clippy (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # No vcpkg cache: with MELLO_SYS_BINDINGS_ONLY this job builds no
      # vcpkg port.
      - name: Set up the build
        uses: ./.github/actions/linux-setup
        with:
          vcpkg: 'false'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # --workspace so crates under tools/ are linted too.
        # Check mode never links, so the mello-sys build script needs only
        # bindgen. MELLO_SYS_BINDINGS_ONLY skips its cmake and libmello build
        # (mello-sys/build.rs). This job runs on its own runner, so that is
        # one full cmake, vcpkg and libmello build less per lane.
        env:
          MELLO_SYS_BINDINGS_ONLY: "1"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Set up the build
        uses: ./.github/actions/linux-setup

      - name: Run tests
        # --tests and no doc-tests: see the Windows job in pr-checks.yml.
        run: cargo test --workspace --tests

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

  cpp:
    name: C++ tests (Linux)
    if: ${{ inputs.native != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # No Rust: this job builds only libmello and its gtest binaries.
      - name: Set up the build
        uses: ./.github/actions/linux-setup
        with:
          rust: 'false'

      # See the Windows job in pr-checks.yml for why MELLO_BUILD_TESTS is opt-in.
      # No Rust build runs first in this job, so external/vcpkg has no vcpkg
      # binary yet. The vcpkg toolchain file bootstraps it before the manifest
      # install (external/vcpkg/scripts/buildsystems/vcpkg.cmake, "Bootstrapping
      # vcpkg before install"). CMake downloads onnxruntime itself.
      - name: Build C++ tests
        run: |
          cmake -B libmello/build-ci -S libmello -G Ninja \
            -DMELLO_BUILD_TESTS=ON \
            -DMELLO_WEBRTC_VIDEO_TIMING=ON \
            -DMELLO_WEBRTC_GOOG_CC=ON \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/external/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build libmello/build-ci --parallel "$(nproc)"

      # See the Windows job in pr-checks.yml for -j.
      - name: Run C++ tests
        run: ctest --test-dir libmello/build-ci --output-on-failure --timeout 300 -j "$(nproc)"

      - name: sccache statistics
        if: always()
        run: sccache --show-stats
