name: PR Checks

on:
  pull_request:
    branches: [main]
    # `edited` is not a default type. A stacked PR is retargeted to main
    # when the PR below it merges, and that is an `edited` event; without
    # it the required checks stay "Expected" until someone pushes or
    # reopens. Title and body edits also fire it; the concurrency group
    # cancels the duplicate run.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hardware-dependent voice/video tests (e.g. host_to_viewer_loopback) block
  # forever waiting on real capture devices unless CI is set. Set it explicitly
  # rather than relying on GitHub's implicit value — mello-sys/tests/video_pipeline.rs
  # is the only test that reads it, and a silent hang here costs a whole runner.
  CI: "true"

jobs:
  # A PR that only touches specs/, plans/, the journeys or the driver skips the
  # build: the Windows build alone takes 16 min on a quiet runner. The journeys
  # and the driver get the `journeys` job instead. This is a job, not
  # `paths-ignore`: the three test jobs are required checks in the main ruleset,
  # and a workflow that never starts leaves them "Expected" forever. A job
  # skipped by its `if:` reports success, so the PR stays mergeable.
  #
  # `native` is false when no input of the C++ build changed. Then the test
  # jobs skip the libmello gtest build and ctest steps. 64 of the last 100
  # merges touched none of these paths. A skipped step does not fail a
  # required job.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      journeys: ${{ steps.filter.outputs.journeys }}
      native: ${{ steps.filter.outputs.native }}

    steps:
      - name: Check which parts changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        # previous_filename catches a rename out of specs/ or plans/.
        run: |
          set -euo pipefail
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          echo "$files"
          # code: a file that the build or the Rust tests read. qa/flows.yaml stays
          # code: a Rust test checks the harness tests that it names.
          if [ -z "$files" ] || grep -qvE '^(specs/|plans/|qa/journeys/|tools/mello-driver/)' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only specs/, plans/, journeys or the driver changed. The build is skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$files" ] || grep -qE '^(qa/journeys/|qa/flows\.yaml|tools/mello-driver/|\.github/workflows/pr-checks\.yml)' <<<"$files"; then
            echo "journeys=true" >> "$GITHUB_OUTPUT"
          else
            echo "journeys=false" >> "$GITHUB_OUTPUT"
          fi
          # native: a file that the libmello gtest build reads, or the CI
          # definition itself. On any doubt (no file list) it is true.
          if [ -z "$files" ] || grep -qE '^(libmello/|mello-sys/|external/|hook/|\.gitmodules$|\.github/workflows/|\.github/actions/)' <<<"$files"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No native input changed. The C++ build and ctest are skipped."
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  # What check.sh does for the journeys and the driver, in about a minute: the
  # syntax of every journey and driver file, the driver tests, and the journeys
  # that qa/flows.yaml names must exist (the part of the Rust flow catalogue test
  # that a PR without the build could break).
  journeys:
    name: Journeys and driver
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.journeys == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the driver's packages
        working-directory: tools/mello-driver
        run: npm ci

      - name: Check the syntax of every journey and driver file
        run: |
          set -euo pipefail
          for f in tools/mello-driver/src/*.ts tools/mello-driver/test/*.ts qa/journeys/*.ts qa/journeys/lib/*.ts; do
            node --check "$f"
          done

      - name: Run the driver tests
        run: node --test "tools/mello-driver/test/*.test.ts"

      - name: The journeys that qa/flows.yaml names exist
        run: |
          set -euo pipefail
          missing=0
          for j in $(sed -nE 's/^ *journeys: \[(.*)\]$/\1/p' qa/flows.yaml | tr ',' '\n' | sed -E 's/^ +| +$//g' | grep -v '^$'); do
            if [ ! -f "$j" ]; then
              echo "::error file=qa/flows.yaml::journey $j does not exist"
              missing=1
            fi
          done
          exit $missing

  test-windows:
    name: Test (Windows)
    needs: changes
    # If detection fails, build anyway. A failed `needs` skips the job by
    # default, and a skipped required check passes.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: [self-hosted, Windows]
    # The full run took ~31 min before the vcpkg cache, /MP and debug-info
    # changes. This bound exists for a wedged runner, not a slow one: a
    # self-hosted machine that sleeps mid-job otherwise blocks the check
    # indefinitely instead of failing.
    timeout-minutes: 45
    # Incremental is off: consecutive runs build different branches, and the
    # data (3.4 GB when it was on) would only grow the kept target dir. Full
    # debug info (2.1 GB of PDBs, 700 MB for the mello_client test binary)
    # only slows codegen and the link. Line tables keep file:line in
    # backtraces. These are env vars, not a `[profile.ci]`: mello-sys/build.rs
    # finds the directory it copies onnxruntime.dll into by walking up OUT_DIR
    # to a path component named `debug` or `release`. Under target/ci/ it
    # finds neither, so the DLL never reaches target/ci/deps next to the
    # test binaries.
    #
    # The Cargo target dir and the libmello gtest build dir live on D: (684 GB
    # free), outside the workspace, and stay between runs. The Cleanup step
    # purges them only above a size cap. They are not the dev checkout's
    # target: the gitignored .cargo/config.toml of a dev checkout bakes
    # secrets into the binaries through option_env!.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: D:\ci\mello\target
      MELLO_CI_BUILD_DIR: D:\ci\mello\build-ci

    steps:
      # clean: false, so the downloaded onnxruntime (377 MB) and the models
      # stay. The next step cleans everything else, with the script of the
      # release lane: it keeps only the ORT of the current ORT_VERSION, and
      # the models only while their stamp matches.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          clean: false

      - name: Reset the workspace, keep ORT and the models
        shell: pwsh
        run: ./scripts/ci/clean-workspace.ps1

      # See the macOS job for why this exists (PR #55 died at link with errno 28).
      # C: holds the workspace, the cargo registry and the vcpkg cache. D:
      # holds the kept build dirs, and `cargo clean` acts on the D: target.
      - name: Reclaim disk space
        shell: pwsh
        run: |
          Get-PSDrive C, D | Select-Object Name,Used,Free
          $vcpkgCache = Join-Path $env:LOCALAPPDATA "vcpkg\archives"
          if (Test-Path $vcpkgCache) {
            Get-ChildItem $vcpkgCache -Recurse -File |
              Where-Object { $_.LastWriteTime -lt (Get-Date).AddDays(-30) } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          $freeC = (Get-PSDrive C).Free
          $freeD = (Get-PSDrive D).Free
          if ($freeC -lt 15GB -or $freeD -lt 15GB) {
            Write-Host "::warning::Only $([math]::Round($freeC/1GB,1)) GB free on C: and $([math]::Round($freeD/1GB,1)) GB on D: — purging the build dirs"
            cargo clean
            Remove-Item -Recurse -Force $env:MELLO_CI_BUILD_DIR -ErrorAction SilentlyContinue
          }

      # client/build_notices.rs runs `cargo tree --offline` for every target,
      # so the crates of every target must be in the cache, not only this
      # host's. Same step as the Linux lane and release.yml.
      - name: Fetch crates
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # --workspace so crates under tools/ are linted too; they are not in
        # default-members, so plain clippy silently skips them.
        # Check mode never links, so the mello-sys build script needs only
        # bindgen (mello-sys/build.rs). The value is the same on every run, so
        # the kept target dir does not run the script again. The test step
        # builds libmello in its own OUT_DIR, as before.
        env:
          MELLO_SYS_BINDINGS_ONLY: "1"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # --tests: every target with test = true (each lib and bin as unit
        # tests, the integration tests), and no doc-tests: all 10 doc-test
        # runs have 0 tests and cost 28 s here. Not --bins: an explicit
        # --bins also selects the bins with test = false.
        run: cargo test --workspace --tests

      # Runs after the Rust build so external/vcpkg is already bootstrapped and
      # the vcpkg binary cache is warm. MELLO_BUILD_TESTS stays OFF by default
      # (mello-sys/build.rs configures libmello on every cargo build, and we do
      # not want 96 gtest cases compiled into every dev build) so CI must opt in.
      # The C++ steps run only when a native input changed (see `changes`).
      # If detection fails, they run.
      - name: Build C++ tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.native == 'true' }}
        shell: pwsh
        run: |
          cmake -B $env:MELLO_CI_BUILD_DIR -S libmello `
            -DMELLO_BUILD_TESTS=ON `
            -DMELLO_WEBRTC_VIDEO_TIMING=ON `
            -DMELLO_WEBRTC_GOOG_CC=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/external/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build $env:MELLO_CI_BUILD_DIR --config Release --parallel $env:NUMBER_OF_PROCESSORS

      # --timeout: a stalled gtest process otherwise holds the lane until
      # the 45 min job timeout. The Linux lane has the same bound.
      # --parallel: 390 of the 421 cases take under 1 s, and run serially
      # their process starts cost 90 s. The device and port suites are
      # RUN_SERIAL in libmello/tests/CMakeLists.txt.
      - name: Run C++ tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.native == 'true' }}
        shell: pwsh
        run: ctest --test-dir $env:MELLO_CI_BUILD_DIR -C Release --output-on-failure --timeout 300 --parallel $env:NUMBER_OF_PROCESSORS

      # The build dirs stay for the next run. Purge them only when the target
      # dir is over 60 GB or D: has less than 30 GB free.
      - name: Cleanup build artifacts
        if: always()
        shell: pwsh
        run: |
          $target = $env:CARGO_TARGET_DIR
          $size = [int64]0
          if (Test-Path $target) {
            $size = [int64](Get-ChildItem $target -Recurse -File -Force -ErrorAction SilentlyContinue |
              Measure-Object Length -Sum).Sum
          }
          $free = (Get-PSDrive D).Free
          Write-Host "Target dir: $([math]::Round($size/1GB,1)) GB. Free on D: $([math]::Round($free/1GB,1)) GB."
          if ($size -gt 60GB -or $free -lt 30GB) {
            Write-Host "Over the cap: cargo clean, and remove $env:MELLO_CI_BUILD_DIR"
            cargo clean
            Remove-Item -Recurse -Force $env:MELLO_CI_BUILD_DIR -ErrorAction SilentlyContinue
          } else {
            Write-Host "Under the cap: keep the target dir and $env:MELLO_CI_BUILD_DIR"
          }

  test-macos:
    name: Test (macOS)
    needs: changes
    # See test-windows for this condition.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: [self-hosted, macOS]
    # ~6 min in practice; see the Windows job for why the bound is generous.
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      # Same values and reasons as the Windows job.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"

    steps:
      # See the Windows job for clean: false.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          clean: false

      # The Cargo target dir and the libmello gtest build dir live outside the
      # workspace and stay between runs, as on Windows. `env:` cannot read
      # $HOME, so this step sets them for the later steps.
      - name: Use the kept build dirs
        run: |
          echo "CARGO_TARGET_DIR=$HOME/ci/mello/target" >> "$GITHUB_ENV"
          echo "MELLO_CI_BUILD_DIR=$HOME/ci/mello/build-ci" >> "$GITHUB_ENV"

      # See the Windows job.
      - name: Reset the workspace, keep ORT and the models
        run: ./scripts/ci/clean-workspace.sh

      # Self-hosted runners live forever, and their caches grow until a build
      # dies at the link step with errno 28 — exactly how PR #55's first run
      # failed. The vcpkg binary cache is content-hashed and small (about
      # 150 MB), but a purge costs about 8 min of port rebuilds on Windows, so
      # only entries not written for 30 days are pruned. `cargo clean` runs
      # here only when free space is critically low (a full rebuild beats a
      # guaranteed link failure); the Cleanup step runs it at the end of a
      # run only when the build dirs are over their cap.
      - name: Reclaim disk space
        run: |
          df -h "$HOME"
          find "$HOME/.cache/vcpkg/archives" -type f -mtime +30 -delete 2>/dev/null || true
          avail_kb=$(df -k "$HOME" | awk 'NR==2 {print $4}')
          min_kb=$((15 * 1024 * 1024))
          if [ "$avail_kb" -lt "$min_kb" ]; then
            echo "::warning::Only $((avail_kb / 1024)) MB free — purging the build dirs"
            cargo clean || true
            rm -rf "$MELLO_CI_BUILD_DIR"
          fi

      # client/build_notices.rs runs `cargo tree --offline` for every target,
      # so the crates of every target must be in the cache, not only this
      # host's. Same step as the Linux lane and release.yml.
      - name: Fetch crates
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # --workspace so crates under tools/ are linted too; they are not in
        # default-members, so plain clippy silently skips them.
        # See the Windows job for MELLO_SYS_BINDINGS_ONLY.
        env:
          MELLO_SYS_BINDINGS_ONLY: "1"
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # --tests and no doc-tests: see the Windows job.
        run: cargo test --workspace --tests

      # See the Windows job for why MELLO_BUILD_TESTS is opt-in. The arch and
      # deployment-target flags mirror mello-sys/build.rs so the test binaries
      # link against the same libmello configuration the Rust build produces.
      # See the Windows job for the `native` condition.
      - name: Build C++ tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.native == 'true' }}
        run: |
          cmake -B "$MELLO_CI_BUILD_DIR" -S libmello \
            -DMELLO_BUILD_TESTS=ON \
            -DMELLO_WEBRTC_VIDEO_TIMING=ON \
            -DMELLO_WEBRTC_GOOG_CC=ON \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/external/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DVCPKG_HOST_TRIPLET=arm64-osx \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release
          # A bare --parallel passes a bare -j to make: unlimited jobs.
          cmake --build "$MELLO_CI_BUILD_DIR" --parallel "$(sysctl -n hw.ncpu)"

      # See the Windows job for --timeout and -j.
      - name: Run C++ tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.native == 'true' }}
        run: ctest --test-dir "$MELLO_CI_BUILD_DIR" --output-on-failure --timeout 300 -j "$(sysctl -n hw.ncpu)"

      # The build dirs stay for the next run. Purge them only when the target
      # dir is over 25 GB or less than 40 GB is free: the Mac has about 88 GB
      # free and a past run died with errno 28.
      - name: Cleanup build artifacts
        if: always()
        run: |
          if [ -z "${CARGO_TARGET_DIR:-}" ]; then
            echo "The build dirs were never set. Nothing to clean."
            exit 0
          fi
          size_kb=0
          if [ -d "$CARGO_TARGET_DIR" ]; then
            size_kb=$(du -sk "$CARGO_TARGET_DIR" | awk '{print $1}')
          fi
          avail_kb=$(df -k "$HOME" | awk 'NR==2 {print $4}')
          echo "Target dir: $((size_kb / 1024 / 1024)) GB. Free: $((avail_kb / 1024 / 1024)) GB."
          if [ "$size_kb" -gt $((25 * 1024 * 1024)) ] || [ "$avail_kb" -lt $((40 * 1024 * 1024)) ]; then
            echo "Over the cap: cargo clean, and remove $MELLO_CI_BUILD_DIR"
            cargo clean || true
            rm -rf "$MELLO_CI_BUILD_DIR"
          else
            echo "Under the cap: keep the target dir and $MELLO_CI_BUILD_DIR"
          fi

  # GitHub-hosted Ubuntu 24.04, defined in linux-build-test.yml so the Linux
  # branch can run it before it has a PR.
  test-linux:
    name: Test (Linux)
    needs: changes
    # See test-windows for this condition.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    uses: ./.github/workflows/linux-build-test.yml
    secrets: inherit
    with:
      # See test-windows for the `native` condition.
      native: ${{ (needs.changes.result != 'success' || needs.changes.outputs.native == 'true') && 'true' || 'false' }}

  # Pure Go unit tests over the Nakama modules — no native deps, no Docker, no
  # backend. Runs on GitHub-hosted Linux (already used by release.yml) rather
  # than competing for the single self-hosted Windows/macOS runners.
  test-backend:
    name: Test (Backend / Go)
    needs: changes
    # See test-windows for this condition.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/nakama/data/modules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/nakama/data/modules/go.mod
          cache-dependency-path: backend/nakama/data/modules/go.sum

      # gofmt is currently unenforced anywhere in the repo; crews.go has drifted.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # These modules are a Nakama plugin, not a standalone binary — `go build`
      # of main fails by design. `go vet` / `go test` are the static gates.
      - name: Run tests
        run: go test ./...
