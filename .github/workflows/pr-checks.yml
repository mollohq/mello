name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hardware-dependent voice/video tests (e.g. host_to_viewer_loopback) block
  # forever waiting on real capture devices unless CI is set. Set it explicitly
  # rather than relying on GitHub's implicit value — mello-sys/tests/video_pipeline.rs
  # is the only test that reads it, and a silent hang here costs a whole runner.
  CI: "true"

jobs:
  test-windows:
    name: Test (Windows)
    runs-on: [self-hosted, Windows]
    # The full run is ~19 min. This bound exists for a wedged runner, not a slow
    # one: a self-hosted machine that sleeps mid-job otherwise blocks the check
    # indefinitely instead of failing.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # See the macOS job for why this exists (PR #55 died at link with errno 28).
      - name: Reclaim disk space
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used,Free
          $vcpkgCache = Join-Path $env:LOCALAPPDATA "vcpkg\archives"
          if (Test-Path $vcpkgCache) {
            Remove-Item -Recurse -Force $vcpkgCache -ErrorAction SilentlyContinue
          }
          $free = (Get-PSDrive C).Free
          if ($free -lt 15GB) {
            Write-Host "::warning::Only $([math]::Round($free/1GB,1)) GB free — purging incremental build dirs"
            cargo clean
            Remove-Item -Recurse -Force libmello/build-ci -ErrorAction SilentlyContinue
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # --workspace so crates under tools/ are linted too; they are not in
        # default-members, so plain clippy silently skips them.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # Runs after the Rust build so external/vcpkg is already bootstrapped and
      # the vcpkg binary cache is warm. MELLO_BUILD_TESTS stays OFF by default
      # (mello-sys/build.rs configures libmello on every cargo build, and we do
      # not want 96 gtest cases compiled into every dev build) so CI must opt in.
      - name: Build C++ tests
        shell: pwsh
        run: |
          cmake -B libmello/build-ci -S libmello `
            -DMELLO_BUILD_TESTS=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/external/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build libmello/build-ci --config Release

      - name: Run C++ tests
        run: ctest --test-dir libmello/build-ci -C Release --output-on-failure

      - name: Cleanup build artifacts
        if: always()
        shell: pwsh
        run: |
          cargo clean
          Remove-Item -Recurse -Force libmello/build-ci -ErrorAction SilentlyContinue

  test-macos:
    name: Test (macOS)
    runs-on: [self-hosted, macOS]
    # ~6 min in practice; see the Windows job for why the bound is generous.
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      # Self-hosted runners live forever, and their caches grow until a build
      # dies at the link step with errno 28 — exactly how PR #55's first run
      # failed. The vcpkg binary cache grows with every dependency hash change
      # and is safe to purge (only costs re-fetching cached packages).
      # target/ is kept for incremental builds unless free space is critically
      # low, in which case a full rebuild beats a guaranteed link failure.
      - name: Reclaim disk space
        run: |
          df -h /
          rm -rf "$HOME/.cache/vcpkg/archives"
          avail_kb=$(df -k / | awk 'NR==2 {print $4}')
          min_kb=$((15 * 1024 * 1024))
          if [ "$avail_kb" -lt "$min_kb" ]; then
            echo "::warning::Only $((avail_kb / 1024)) MB free — purging incremental build dirs"
            cargo clean || true
            rm -rf libmello/build-ci
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # --workspace so crates under tools/ are linted too; they are not in
        # default-members, so plain clippy silently skips them.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # See the Windows job for why MELLO_BUILD_TESTS is opt-in. The arch and
      # deployment-target flags mirror mello-sys/build.rs so the test binaries
      # link against the same libmello configuration the Rust build produces.
      - name: Build C++ tests
        run: |
          cmake -B libmello/build-ci -S libmello \
            -DMELLO_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/external/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DVCPKG_HOST_TRIPLET=arm64-osx \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build libmello/build-ci

      - name: Run C++ tests
        run: ctest --test-dir libmello/build-ci --output-on-failure

      - name: Cleanup build artifacts
        if: always()
        run: |
          cargo clean
          rm -rf libmello/build-ci

  # Pure Go unit tests over the Nakama modules — no native deps, no Docker, no
  # backend. Runs on GitHub-hosted Linux (already used by release.yml) rather
  # than competing for the single self-hosted Windows/macOS runners.
  test-backend:
    name: Test (Backend / Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/nakama/data/modules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/nakama/data/modules/go.mod
          cache-dependency-path: backend/nakama/data/modules/go.sum

      # gofmt is currently unenforced anywhere in the repo; crews.go has drifted.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # These modules are a Nakama plugin, not a standalone binary — `go build`
      # of main fails by design. `go vet` / `go test` are the static gates.
      - name: Run tests
        run: go test ./...
