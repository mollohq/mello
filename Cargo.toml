[workspace]
resolver = "2"
members = [
    "build-stamp",
    "client",
    "hud",
    "mello-core",
    "mello-core-ffi",
    "mello-sys",
    "renderer-d2d",
    "tools/stream-host",
    "tools/rtp-client-test",
    "tools/sfu-stream-viewer-probe",
    "tools/voice-test-client",
    "tools/perf-harness",
    "tools/perf-scenarios",
    "tools/canary",
    "tools/e2e",
    "tools/voice-gate",
    "tools/stream-gate",
]
# Vendored upstream code. It is not ours to lint or format.
exclude = ["third_party/i-slint-backend-winit"]
default-members = [
    "build-stamp",
    "client",
    "hud",
    "mello-core",
    "mello-sys",
]

[workspace.package]
version = "0.0.0-DEV"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mollohq/mello"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }

# Slint 1.18.1 on Windows leaves the window transparent after a minimize and
# restore (slint-ui/slint#13537). This is i-slint-backend-winit 1.18.1 with the
# upstream fix (slint-ui/slint#13568) applied, and with the hook for mello's
# Direct2D renderer (renderer-d2d, feature renderer-d2d): the backend's renderer
# trait is private, so a new renderer needs this copy. The backport can go at
# Slint 1.18.2 (mollohq/mello#159); the hook stays until Slint has a public
# renderer hook (specs/features/D2D-RENDERER.md section 10).
[patch.crates-io]
i-slint-backend-winit = { path = "third_party/i-slint-backend-winit" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
# Size trial: optimize Rust for size. Hot DSP loops live in C++ and native
# libs, so impact should be UI/cold paths only. Validate with perf-harness.
opt-level = "z"


# Live screenshots in the e2e driver (Slint MCP take_screenshot) encode a PNG on
# the UI thread. At opt-level 0 that blocks the app for about 0.9 s, which also
# delays the state port and slows a journey. These crates are small; optimize
# them in dev builds. See plans/E2E-QA.md section 16.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package."png@0.18.1"]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.i-slint-renderer-skia]
opt-level = 3
[profile.dev.package.i-slint-backend-testing]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
# The voice quality gate (tools/voice-gate) resamples and cross-correlates
# minutes of 48 kHz audio. At opt-level 0 the analysis alone exceeds the
# gate's 5 minute budget. Tool crate only; no production code changes.
[profile.dev.package.voice-gate]
opt-level = 3
