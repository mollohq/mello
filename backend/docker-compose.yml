version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mello-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nakama"]
      interval: 5s
      timeout: 5s
      retries: 5

  nakama-build:
    image: heroiclabs/nakama-pluginbuilder:3.21.0
    platform: linux/amd64
    container_name: mello-nakama-build
    volumes:
      - ./nakama/data/modules:/backend
    working_dir: /backend
    entrypoint:
      - /bin/sh
      - -c
      - |
        go mod tidy && go build -buildmode=plugin -trimpath -o ./backend.so .

  minio:
    image: minio/minio
    container_name: mello-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: mello-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mello-clips &&
        mc anonymous set download local/mello-clips &&
        mc mb --ignore-existing local/mello-snapshots &&
        mc anonymous set download local/mello-snapshots &&
        mc mb --ignore-existing local/mello-diagnostics &&
        echo "Buckets mello-clips, mello-snapshots and mello-diagnostics ready"

  nakama:
    image: heroiclabs/nakama:3.21.0
    platform: linux/amd64
    container_name: mello-nakama
    depends_on:
      postgres:
        condition: service_healthy
      nakama-build:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      - STEAM_PUBLISHER_KEY=${STEAM_PUBLISHER_KEY:-}
      - STEAM_APP_ID=${STEAM_APP_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:-defaulthttpkey}
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_HOST=${TURN_HOST:-}
      - SFU_JWT_PRIVATE_KEY=${SFU_JWT_PRIVATE_KEY:-}
      - SFU_ENDPOINT_EU=${SFU_ENDPOINT_EU:-wss://sfu-eu.m3llo.app/ws}
      - S3_ENDPOINT=http://minio:9000
      - S3_PRESIGN_ENDPOINT=http://localhost:9000
      - S3_BUCKET=mello-clips
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_PUBLIC_URL=http://localhost:9000/mello-clips
      - SNAPSHOTS_S3_BUCKET=mello-snapshots
      - SNAPSHOTS_S3_PUBLIC_URL=http://localhost:9000/mello-snapshots
      # Private bucket for user-driven diagnostic log captures (no public URL).
      - DIAGNOSTICS_S3_BUCKET=mello-diagnostics
      # Remote push (spec 23). Unset = pushes are skipped. scripts/e2e.sh points
      # these at a stub Worker that the e2e test runs on the host.
      - PUSH_WORKER_URL=${PUSH_WORKER_URL:-}
      - PUSH_WORKER_TOKEN=${PUSH_WORKER_TOKEN:-}
      - PUSH_DESKTOP_GRACE_SECS=${PUSH_DESKTOP_GRACE_SECS:-}
    # Lets the container reach a stub on the host; Docker Desktop has this name
    # already, Linux needs the mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -c
      - |
        /nakama/nakama migrate up --database.address nakama:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --runtime.http_key ${NAKAMA_HTTP_KEY:-defaulthttpkey}
    volumes:
      - ./nakama/data:/nakama/data
    ports:
      - "7350:7350" # gRPC API
      - "7351:7351" # HTTP API / Admin Console
      - "7352:7352" # gRPC API (alternate)
    healthcheck:
      # Use Nakama's own healthcheck subcommand: the image ships no curl (nor
      # wget or nc), so the previous `curl -f ...` probe could never run and
      # reported the container permanently unhealthy — "executable file not
      # found in $PATH" — even while it served traffic fine. That made
      # `docker compose up --wait` fail against a working stack.
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The local SFU. The SFU is the only media transport for voice and streams,
  # so client-dev needs it. It is off by default, so the production default of
  # SFU_ENDPOINT_EU stays as it is. To start it:
  #
  #   ./scripts/dev-sfu-keys.sh        # one time: key pair + .env lines
  #   docker compose --profile sfu up -d --build
  #
  # MELLO_SFU_DIR is the mello-sfu checkout (default: next to this repo).
  # SFU_PUBLIC_IP is the address in the ICE candidates. 127.0.0.1 is only for
  # clients on this machine; set the LAN address in .env for a second computer.
  sfu:
    profiles: ["sfu"]
    build: ${MELLO_SFU_DIR:-../../mello-sfu}
    container_name: mello-sfu
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ${SFU_JWT_PUB_KEY_FILE:-./sfu_public.pem}:/certs/jwt_pub.pem:ro
    ports:
      - "8443:8443" # signaling (ws)
      - "8080:8080" # health and admin
      - "10000-10100:10000-10100/udp" # media
      - "10000:10000/tcp" # media over ICE-TCP
    environment:
      SFU_ADDR: ":8443"
      SFU_ADMIN_ADDR: ":8080"
      SFU_PUBLIC_IP: "${SFU_PUBLIC_IP:-127.0.0.1}"
      # The backend's region name: the SFU refuses a token signed for
      # another region (mello-sfu 01-SFU.md section 7.1). SFU_ENDPOINT_EU
      # points here, so the backend signs eu-west.
      SFU_REGION: "eu-west"
      SFU_SERVER_ID: "sfu-local"
      SFU_LOG_LEVEL: "debug"
      SFU_JWT_PUB_KEY: "/certs/jwt_pub.pem"
      # Empty means the admin API needs no password (local only).
      SFU_ADMIN_PASSWORD: "${SFU_ADMIN_PASSWORD:-}"
      SFU_R2_ENDPOINT: "http://minio:9000"
      SFU_R2_BUCKET: "mello-snapshots"
      SFU_R2_ACCESS_KEY_ID: "minioadmin"
      SFU_R2_SECRET_ACCESS_KEY: "minioadmin"
      SFU_SNAPSHOT_INTERVAL_S: "10"

volumes:
  postgres_data:
  minio_data:
