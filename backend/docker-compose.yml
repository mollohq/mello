version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mello-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nakama"]
      interval: 5s
      timeout: 5s
      retries: 5

  nakama-build:
    image: heroiclabs/nakama-pluginbuilder:3.21.0
    platform: linux/amd64
    container_name: mello-nakama-build
    volumes:
      - ./nakama/data/modules:/backend
    working_dir: /backend
    entrypoint:
      - /bin/sh
      - -c
      - |
        go mod tidy && go build -buildmode=plugin -trimpath -o ./backend.so .

  # S3 storage for clips, snapshots and diagnostics. RustFS stands in for
  # MinIO: MinIO archived its Community Edition in 2026 and removed every
  # minio/minio and minio/mc image from Docker Hub and quay.io. RustFS keeps
  # port 9000, path-style addressing and the minioadmin credentials, so the
  # S3_* env below and the SFU_R2_* env of mello-sfu do not change.
  s3:
    image: rustfs/rustfs:1.0.4
    container_name: mello-s3
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      # Explicit IPv4. The default ":9000" is an IPv6-only listener on a
      # Linux engine, so a neighbour container cannot connect over IPv4
      # while the container's own health check on 127.0.0.1 passes.
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console (minioadmin / minioadmin)
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Makes the buckets and opens anonymous download on the two public ones.
  # rc is the RustFS client; its commands are the ones mc had.
  s3-init:
    image: rustfs/rc:v0.1.36
    container_name: mello-s3-init
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        rc alias set local http://s3:9000 minioadmin minioadmin &&
        rc bucket create --ignore-existing local/mello-clips &&
        rc bucket anonymous set download local/mello-clips &&
        rc bucket create --ignore-existing local/mello-snapshots &&
        rc bucket anonymous set download local/mello-snapshots &&
        rc bucket create --ignore-existing local/mello-diagnostics &&
        echo "Buckets mello-clips, mello-snapshots and mello-diagnostics ready"

  nakama:
    image: heroiclabs/nakama:3.21.0
    platform: linux/amd64
    container_name: mello-nakama
    depends_on:
      postgres:
        condition: service_healthy
      nakama-build:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    environment:
      - STEAM_PUBLISHER_KEY=${STEAM_PUBLISHER_KEY:-}
      - STEAM_APP_ID=${STEAM_APP_ID:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:-defaulthttpkey}
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_HOST=${TURN_HOST:-}
      - SFU_JWT_PRIVATE_KEY=${SFU_JWT_PRIVATE_KEY:-}
      - SFU_ENDPOINT_EU=${SFU_ENDPOINT_EU:-wss://sfu-eu.m3llo.app/ws}
      - S3_ENDPOINT=http://s3:9000
      - S3_PRESIGN_ENDPOINT=http://localhost:9000
      - S3_BUCKET=mello-clips
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_PUBLIC_URL=http://localhost:9000/mello-clips
      - SNAPSHOTS_S3_BUCKET=mello-snapshots
      - SNAPSHOTS_S3_PUBLIC_URL=http://localhost:9000/mello-snapshots
      # Private bucket for user-driven diagnostic log captures (no public URL).
      - DIAGNOSTICS_S3_BUCKET=mello-diagnostics
      # Remote push (spec 23). Unset = pushes are skipped. scripts/e2e.sh points
      # these at a stub Worker that the e2e test runs on the host.
      - PUSH_WORKER_URL=${PUSH_WORKER_URL:-}
      - PUSH_WORKER_TOKEN=${PUSH_WORKER_TOKEN:-}
      - PUSH_DESKTOP_GRACE_SECS=${PUSH_DESKTOP_GRACE_SECS:-}
    # Lets the container reach a stub on the host; Docker Desktop has this name
    # already, Linux needs the mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -c
      - |
        /nakama/nakama migrate up --database.address nakama:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --runtime.http_key ${NAKAMA_HTTP_KEY:-defaulthttpkey}
    volumes:
      - ./nakama/data:/nakama/data
    ports:
      - "7350:7350" # gRPC API
      - "7351:7351" # HTTP API / Admin Console
      - "7352:7352" # gRPC API (alternate)
    healthcheck:
      # Use Nakama's own healthcheck subcommand: the image ships no curl (nor
      # wget or nc), so the previous `curl -f ...` probe could never run and
      # reported the container permanently unhealthy — "executable file not
      # found in $PATH" — even while it served traffic fine. That made
      # `docker compose up --wait` fail against a working stack.
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  s3_data:
