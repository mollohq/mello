[package]
name = "mello-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.bundle]
name = "Mello"
identifier = "app.mello.desktop"
icon = ["assets/icons/mello.ico", "assets/icons/mello.icns"]
short_description = "Hang out with your crew."
osx_url_schemes = ["mello"]

[lib]
name = "mello_client"
path = "src/lib.rs"

[[bin]]
name = "mello"
path = "src/main.rs"

[dependencies]
build-stamp = { path = "../build-stamp" }
mello-core = { path = "../mello-core" }
perf-scenarios = { path = "../tools/perf-scenarios" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "accessibility"] }
tokio = { workspace = true }
log = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "5"
confy = "2.0.0"
uuid = { version = "1", features = ["v4"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
paste = "1"

# Dev-only: embedded MCP server for AI-driven UI inspection (gated by the `mcp` feature).
# Runtime is a no-op unless SLINT_MCP_PORT is set; never enabled in production builds.
i-slint-backend-testing = { version = "=1.18.1", optional = true, features = ["mcp"] }

# Only pulled in by the `testkit` feature (integration tests); also a
# dev-dependency below so in-crate `cfg(test)` builds get it without the feature.
tempfile = { version = "3", optional = true }

# Auto-updater
velopack = "0.0.1298"
semver = "1"

# Avatar upload, image loading & SVG rasterization
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
resvg = "0.47"
base64 = "0.22"
reqwest = { workspace = true, features = ["blocking"] }
arboard = "3"
rand = "0.8"

# Native platform integration
open = "5"
tray-icon = "0.21"
rdev = "0.5"
single-instance = "0.3"
notify-rust = "4"
auto-launch = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
windows-numerics = "0.3"
# renderer-d2d: mello's Direct2D renderer, the Windows default (spec 12 section 3.1,
# m3llo-fx-lab WINDOWS.md 3.6). The feature puts it into the vendored winit backend;
# the crate itself is used for the device probe at startup (renderer_choice.rs).
i-slint-backend-winit = { version = "=1.18.1", features = ["renderer-d2d"] }
i-slint-renderer-d2d = { path = "../renderer-d2d" }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"
# kAEGetURL handler for mello:// links (platform/macos_url_events.rs).
objc2 = "0.6"
i-slint-backend-winit = { version = "=1.18.1", features = ["renderer-skia"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Renderer selection (updater/startup_update.rs): Skia on wgpu, or Skia's CPU
# rasterizer.
i-slint-backend-winit = { version = "=1.18.1", features = ["renderer-skia"] }
# The Vulkan probe (platform/linux_gpu.rs): the wgpu 30 that Skia renders
# with, already in the tree. No features of our own: Slint's choice decides
# the backends, so the probe sees what the renderer will see. (Slint's
# `unstable-wgpu-30` re-export would also pull in FemtoVG.)
wgpu = { version = "30", default-features = false }
# The tray as a StatusNotifierItem (platform/linux_tray.rs). tray-icon builds
# its Linux menu with GTK, which needs a GTK main loop the client does not run.
# async-io, not tokio: ksni's tokio feature turns on zbus's tokio mode for the
# whole binary, and then every zbus user outside a tokio runtime (notify-rust,
# rfd) panics with "there is no reactor running" (2026-10-31).
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# The GlobalShortcuts portal for push-to-talk on Wayland
# (platform/linux_shortcuts.rs). 0.11.1 with async-std: the version and the
# runtime feature rfd already uses (ashpd refuses tokio and async-std at once).
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
# StreamExt for the portal's signal streams. Already in the tree (zbus, rfd).
futures-util = "0.3"

[features]
default = ["development"]
production = []
development = []
mcp = ["dep:i-slint-backend-testing"]
# Test-only driver surface for e2e journeys and agent runners (plans/E2E-QA.md).
# Adds the state port on top of the MCP server. Never enabled in shipped builds.
e2e = ["mcp", "mello-core/e2e-session", "mello-core/e2e-oauth", "mello-core/e2e-mic", "mello-core/e2e-game"]
# Exposes AppContext::for_test and the headless UI harness to integration
# tests in client/tests/. Never enabled in shipped builds. Activates the
# testing backend as a real (non-dev) dependency; note this does NOT turn on
# mello-client's own `mcp` feature, so run() still won't start an MCP server.
testkit = ["dep:i-slint-backend-testing", "dep:tempfile"]

[dev-dependencies]
toml = "0.8"
# Isolated config dirs so tests never write the developer's real settings.
tempfile = "3"
# Exact pin is mandatory: this crate explicitly does not follow semver and must
# match the `slint` version. A patch bump can break compilation outright.
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build = { version = "1.18", default-features = false, features = ["compat-1-18"] }
winresource = "0.1"
