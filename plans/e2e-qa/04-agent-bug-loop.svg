<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 380" role="img"><title>Agent bug-filing loop</title><desc>A protocol case goes to an agent run on the real app, then to a verdict with evidence. A failure is fingerprinted to avoid duplicates, filed as a GitHub issue with the qa-agent label, and triaged by a human. A confirmed bug becomes a scripted journey that joins the PR gate.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.th{font-size:14px;font-weight:600;fill:#2C2C2A}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="380" rx="12" fill="#FFFFFF"/>
<g class="c-purple"><rect x="50" y="40" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="60" text-anchor="middle" dominant-baseline="central">Protocol case</text><text class="ts" x="130" y="80" text-anchor="middle" dominant-baseline="central">STE steps and checks</text></g>
<line x1="210" y1="68" x2="258" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="260" y="40" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Agent run</text><text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">Real app via driver</text></g>
<line x1="420" y1="68" x2="468" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="470" y="40" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="60" text-anchor="middle" dominant-baseline="central">Verdict</text><text class="ts" x="550" y="80" text-anchor="middle" dominant-baseline="central">Pass, fail or unsure</text></g>
<line x1="550" y1="96" x2="550" y2="148" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="470" y="150" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="170" text-anchor="middle" dominant-baseline="central">Fingerprint</text><text class="ts" x="550" y="190" text-anchor="middle" dominant-baseline="central">Dedupe open issues</text></g>
<line x1="470" y1="178" x2="422" y2="178" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="260" y="150" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="170" text-anchor="middle" dominant-baseline="central">GitHub issue</text><text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central">Label qa-agent</text></g>
<line x1="260" y1="178" x2="212" y2="178" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="50" y="150" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="170" text-anchor="middle" dominant-baseline="central">Human triage</text><text class="ts" x="130" y="190" text-anchor="middle" dominant-baseline="central">Confirm or close</text></g>
<line x1="130" y1="206" x2="130" y2="258" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="50" y="260" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="130" y="280" text-anchor="middle" dominant-baseline="central">Scripted journey</text><text class="ts" x="130" y="300" text-anchor="middle" dominant-baseline="central">Joins the PR gate</text></g>
<text class="ts" x="230" y="288" dominant-baseline="central">↻ the bug cannot return without a red gate</text>
<rect class="c-purple" x="50" y="343" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="72" y="350" dominant-baseline="central">Automated</text>
<rect class="c-teal" x="170" y="343" width="14" height="14" rx="3" stroke-width="0.5"/>
<text class="ts" x="192" y="350" dominant-baseline="central">Human decision, then permanent</text>
</svg>
