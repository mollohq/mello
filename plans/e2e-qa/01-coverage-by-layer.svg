<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 420" role="img"><title>Test coverage by system layer</title><desc>A matrix of seven system layers against six test suites. Today's suites each cover two or three adjacent layers. No suite covers pixels through a second user. The proposed scripted journeys cover all seven layers.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
.t{font-size:14px;font-weight:400;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.grid{stroke:#D3D1C7;stroke-width:0.5}
rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
</style>
